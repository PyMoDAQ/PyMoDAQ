# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
          
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch hatchling
    - name: Build and publish
      env:
        HATCH_INDEX_USER: ${{ secrets.PYPI_USERNAME }}
        HATCH_INDEX_AUTH: ${{ secrets.PYPI_PASSWORD }}
      run: |
        git fetch --tags
        release_tag="${GITHUB_REF_NAME}"
        published=0
        failed=0
        for package in pymodaq_utils pymodaq_data pymodaq_gui pymodaq_scripting pymodaq; do
          cd packages/${package}
          current_version=$(hatch version)
          if [[ "${current_version}" == "${release_tag}" ]]; then
            if hatch build && hatch publish; then
              published=$((published+1))
            else
              echo "::error::${package} ${current_version} could not be built or published"
              failed=1
            fi
          else
            echo "::notice::${package} is at ${current_version}, not at the release ${release_tag}: skipped"
          fi
          cd ../../
        done
        if [[ ${published} -eq 0 ]]; then
          echo "::error::no package has the version of the release ${release_tag}: nothing was published"
          exit 1
        fi
        exit ${failed}
