name: Test for pymodaq

on:
  workflow_dispatch:
  workflow_call:

  pull_request:
    paths:
      - 'packages/pymodaq/**'
    branches:
      - '*'
      - '!badges'
  push:
    paths:
      - 'packages/pymodaq/**'
    branches:
      - '*'
      - '!badges'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ["ubuntu-latest", "windows-latest"]
            python-version: "3.11"
            qt-backend: ["pyqt6", "pyside6"]
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_QT_API: ${{ matrix.qt-backend }}
      QT_API: ${{ matrix.qt-backend }}
    defaults:
      run:
        working-directory: packages/pymodaq

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
        id: extract_branch

      - name: Create badge destination directory
        run: mkdir -p "${{ github.workspace }}/${{ steps.extract_branch.outputs.branch }}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd ../../
          python install-packages.py -d -u pymodaq -qt "${{ matrix.qt-backend }}"

      - name: Setup Headless GUI & Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y xvfb yaru-theme-icon libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-cursor0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libgl1 libegl1
          echo "QT_DEBUG_PLUGINS=0" >> $GITHUB_ENV  # Disable plugin debugging
          echo "QT_QPA_PLATFORM_PLUGIN_PATH=" >> $GITHUB_ENV

          echo "XDG_CURRENT_DESKTOP=Unity" >> $GITHUB_ENV
          echo "XDG_DATA_DIRS=/usr/share:/usr/share/icons:/usr/local/share" >> $GITHUB_ENV
          echo "GTK_THEME=Yaru" >> $GITHUB_ENV
          echo "QT_LOGGING_RULES=qt.qpa.plugin=false" >> $GITHUB_ENV  # Reduce plugin spam

          # Force XCB platform and use software GL for stability on CI
          echo "QT_QPA_PLATFORM=xcb" >> $GITHUB_ENV
          echo "QT_OPENGL=offscreen" >> $GITHUB_ENV
          echo "QT_XCB_GL_INTEGRATION=xcb_glx" >> $GITHUB_ENV
          echo "QT_API=${{ matrix.qt-backend }}" >> $GITHUB_ENV

      - name: Export debug variables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "QT_DEBUG_PLUGINS=1" >> $env:GITHUB_ENV
          echo "QT_QPA_PLATFORM=offscreen" >> $env:GITHUB_ENV    # or minimal if offscreen fails
          echo "QT_OPENGL=software" >> $env:GITHUB_ENV
          echo "QT_QUICK_BACKEND=software" >> $env:GITHUB_ENV
          echo "QT_ENABLE_HIGHDPI_SCALING=0" >> $env:GITHUB_ENV
          echo "QT_API=${{ matrix.qt-backend }}" >> $env:GITHUB_ENV

      - name: Dump Python / Qt / pytest-qt / qtpy info
        shell: bash
        run: |
          python - <<'PY'
          import sys, platform
          print('python:', sys.version)
          print('platform:', platform.platform())
          try:
              import qtpy
              print('qtpy.API_NAME:', getattr(qtpy, 'API_NAME', '<unset>'))
              print('qtpy.API:', getattr(qtpy, 'API', '<unset>'))
          except Exception as e:
              print('qtpy import error:', e)
          try:
              import pytestqt
              print('pytest-qt ok')
          except Exception as e:
              print('pytest-qt import error:', e)
          for mod in ('PyQt6','PyQt5','PySide6'):
              try:
                  m = __import__(mod)
                  print(f"{mod}:", getattr(m, '__version__', '<unknown>'))
              except Exception:
                  pass
          import subprocess
          subprocess.run(['python', '-m', 'pip', 'freeze'])
          PY
          echo "QT_QPA_PLATFORM=${QT_QPA_PLATFORM:-<unset>}"
          echo "PYTEST_QT_API=${PYTEST_QT_API:-<unset>}"
          echo "QT_API=${QT_API:-<unset>}"

      - name: Linting with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=docs

      - name: Tests with ${{ matrix.os }} ${{ matrix.python-version }} ${{ matrix.qt-backend}}
        id: tests
        shell: bash
        run: |
          # 1. Format workspace path properly
          workspace=$(echo "${{ github.workspace }}" | tr '\\' '/')
          mkdir -p "${workspace}/coverage"

          # 2. Run the test suite
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a bash -c 'python -X faulthandler -m pytest --capture=no -vv --cov=pymodaq -m "not leco"'
          else
            python -m pytest -vv --cov=pymodaq -m "not leco"
          fi

          # 3. Save pytest exit code to preserve test results
          pytest_exit_code=$?

          # 4. Move coverage file safely using Python to avoid OS-specific 'mv' issues
          if [ -f .coverage ]; then
            echo "Moving .coverage file..."
            python -c "import shutil; shutil.move('.coverage', '${workspace}/coverage/coverage_${{ matrix.os }}_${{ matrix.python-version }}_${{ matrix.qt-backend }}')"
          else
            echo "Warning: .coverage file not found in $(pwd)"
          fi

          # 5. Exit with the original pytest status code
          exit $pytest_exit_code

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}_${{ matrix.qt-backend }}
          path: ${{ github.workspace }}/coverage/coverage_${{ matrix.os }}_${{ matrix.python-version }}_${{ matrix.qt-backend }}

      - name: Create destination directory
        if: ${{ always() }}
        run: mkdir -p "${{ steps.extract_branch.outputs.branch }}"

      - name: generate badge (success)
        if: ${{ success() }}
        uses: emibcn/badge-action@v2.0.3
        with:
          label: ''
          status: 'passing'
          color: 'green'
          path: '${{ github.workspace }}/${{ steps.extract_branch.outputs.branch }}/tests_${{runner.os}}_${{matrix.python-version}}_${{matrix.qt-backend}}.svg'

      - name: generate badge (fail)
        if: ${{ failure() }}
        uses: emibcn/badge-action@v2.0.3
        with:
          label: ''
          status: 'failing'
          color: 'red'
          path: '${{ github.workspace }}/${{ steps.extract_branch.outputs.branch }}/tests_${{runner.os}}_${{matrix.python-version}}_${{matrix.qt-backend}}.svg'

      - name: Upload badge artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests_${{runner.os}}_${{matrix.python-version}}_${{matrix.qt-backend}}
          path: '${{ github.workspace }}/${{ steps.extract_branch.outputs.branch }}/tests_${{runner.os}}_${{matrix.python-version}}_${{matrix.qt-backend}}.svg'
          if-no-files-found: error

    outputs:
      branch: ${{ steps.extract_branch.outputs.branch }}

  badge-update:
    if: github.repository == 'PyMoDAQ/PyMoDAQ' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          ref: badges
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download badges
        uses: actions/download-artifact@v8

      - name: Reorganize badges
        run: |
          rm -rf coverage* || true
          rm -rf $(git ls-files ${{ needs.tests.outputs.branch }}/*) || true
          git rm -r $(git ls-files ${{ needs.tests.outputs.branch }}/*) || true

          mkdir -p 'pymodaq/${{ needs.tests.outputs.branch }}'
          mv tests_*/*.svg 'pymodaq/${{ needs.tests.outputs.branch }}/' || true

      - name: Commit & Push badges
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pymodaq/
          if git commit --allow-empty -m "Add/Update badge"; then
            git push origin badges
          fi

  coverage-update:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v5.0.0

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./coverage-reports

      - name: Reorganize reports
        run: |
          cd coverage-reports
          rm -rf tests_* || true
          for folder in *; do
            if [ -d "$folder" ]; then
              mv "${folder}"/* . 2>/dev/null || true
            fi
          done;
          cd ..

      - name: Combine coverage reports
        run: |
          python -m pip install coverage
          coverage combine ./coverage-reports/coverage_* || true
          mv .coverage merged_coverage_pymodaq

      - name: Upload merged coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: merged-coverage-pymodaq
          path: merged_coverage_pymodaq