[control_modules]
settings_as_popup = false
control_module_ini_polling = 60 # in seconds

[actuator]
ui = ['Simple', 'Relative', 'Binary'] #other eventual options will be added programmaticaly at startup
epsilon_default = 1
polling_interval_ms = 100  # ms Careful when using TCP/IP connection as you can saturate the connection with too much polling
polling_timeout_s = 20  # s
refresh_timeout_ms = 500  # ms
siprefix = true  # tell if printing of current value use a SI prefix or not (µ, m, k, M...)
siprefix_even_without_units = false
display_units = true # display units in the SpinBoxes
default_value_red = 0.0
default_value_green = 1.0
default_value_relative = 1.0
controls_as_popup = false

[actuator.allowed_units]
V = 'V'
volt = 'volt'
W = 'W'
Hz = 'Hz'
rpm = 'rpm'
revolutions_per_minute = 'revolutions_per_minute'

[viewer]
daq_type = 'DAQ0D' #either "DAQ0D", "DAQ1D", "DAQ2D", "DAQND"
viewer_in_thread = true
timeout = 10000  # default duration in ms to wait for data to be acquirred
allow_settings_edition = false  # during grab

[scan]
scan_in_thread = true
show_popups = true
default = "Scan2D"
Naverage = 1  # minimum is 1
average_on_top = false
steps_limit = 1000  # the limit of the number of steps you can set in a given scan
sort1D = true
stop_on_timeout = true  # if False, a hardware timeout during a scan step will be logged but the scan will continue

[scan.timeflow]
wait_time = 0
wait_time_between = 0

[optimizer]
    n_iter = 100

    [optimizer.bounds]
    actuator_min = -10
    actuator_max = 10

[launcher]
max_history_size = 20
keep_duplicates = false
